<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>尚未解鎖行政區</title>
  <link rel="stylesheet" href="期末專題.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <a href="期末專題.html"><img src="banner.jpg" alt="導覽圖片" class="nav-image"></a>
    </div>
    <nav class="nav">
      <!-- 可複製原本主選單 -->
    </nav>
  </div>
</header>

<main>
  <div class="locked-districts">
  <h2>尚未解鎖行政區</h2>

  <label class="district-label">
    <input type="checkbox">
    <span>土城區</span>
    <div class="district-info">
      <p>簡介: 位於新北市西南部，擁有自然景觀及文化古蹟。</p>
    </div>
  </label>

  <label class="district-label">
    <input type="checkbox">
    <span>五股區</span>
    <div class="district-info">
      <p>簡介: 位於新北市北部，工業區密集，河濱景觀佳。</p>
    </div>
  </label>

  <label class="district-label">
    <input type="checkbox">
    <span>泰山區</span>
    <div class="district-info">
      <p>簡介: 泰山區以住宅區為主，兼具傳統市場與商圈。</p>
    </div>
  </label>

  <label class="district-label">
    <input type="checkbox">
    <span>三芝區</span>
    <div class="district-info">
      <p>簡介: 位於北海岸，有美麗海景與農村景觀。</p>
    </div>
  </label>

  <label class="district-label">
    <input type="checkbox">
    <span>石門區</span>
    <div class="district-info">
      <p>簡介: 北海岸觀光景點集中，知名景點有老梅綠石槽。</p>
    </div>
  </label>

  <label class="district-label">
    <input type="checkbox">
    <span>貢寮區</span>
    <div class="district-info">
      <p>簡介: 以海邊沙灘與漁港文化聞名，每年舉辦國際音樂祭。</p>
    </div>
  </label>

  <label class="district-label">
    <input type="checkbox">
    <span>金山區</span>
    <div class="district-info">
      <p>簡介: 擁有溫泉、海岸與歷史古蹟，是北海岸熱門景點。</p>
    </div>
  </label>

  <label class="district-label">
    <input type="checkbox">
    <span>萬里區</span>
    <div class="district-info">
      <p>簡介: 著名的野柳地質公園與海岸風光所在地。</p>
    </div>
  </label>
</div>


</main>
</body>
</html>
