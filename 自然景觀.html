<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>自然景觀</title>
  <link rel="stylesheet" href="期末專題.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <a href="期末專題.html"><img src="banner.jpg" alt="導覽圖片" class="nav-image"></a>
    </div>
    <nav class="nav">
      <!-- 可複製原本主選單 -->
    </nav>
  </div>
</header>

<main>
  <div class="top-nature">
  <h2>自然景觀前五名</h2>
  <div class="blocks-container">
    <!-- Block 1 -->
    <div class="nature-block">
      <div class="rank">1</div>
      <img src="DSC08613.JPG" alt="雲仙樂園">
      <h3>雲仙樂園</h3>
      <p>在山林間的一座樂園，彷彿置身人間仙境，是個遠離城市喧囂最佳的秘境。</p>
    </div>

    <!-- Block 2 -->
    <div class="nature-block">
      <div class="rank">2</div>
      <img src="IMG_4400.jpg" alt="十分瀑布">
      <h3>十分瀑布</h3>
      <p>隱身於深林中，瀑布被霧氣環繞，水流自懸崖傾瀉而下，激起水花，形成壯麗的景觀。</p>
    </div>

    <!-- Block 3 -->
    <div class="nature-block">
      <div class="rank">3</div>
      <img src="IMG_3861.jpg" alt="擎天岡">
      <h3>擎天岡</h3>
      <p>一望無際的草原，與藍天交織成一幅美麗的畫，牛群的點綴更為其增添了生命力。</p>
    </div>

    <!-- Block 4 -->
    <div class="nature-block">
      <div class="rank">4</div>
      <img src="IMG_4076.JPG" alt="大稻埕碼頭">
      <h3>大稻埕碼頭</h3>
      <p>城市的一隅，保留著開闊的河岸風光，一年一度的煙火慶典，在空中留下絢麗的色彩。</p>
    </div>

    <!-- Block 5 -->
    <div class="nature-block">
      <div class="rank">5</div>
      <img src="IMG_4236.jpg" alt="八里左岸碼頭">
      <h3>八里左岸碼頭</h3>
      <p>騎著腳踏車，微風輕拂過臉頰，彷彿獲得了片刻的喘息時間。</p>
    </div>
  </div>
</div>



</main>
</body>
</html>
