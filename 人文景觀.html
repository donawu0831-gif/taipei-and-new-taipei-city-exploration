<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>人文景觀</title>

</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <a href="期末專題.html"><img src="banner.jpg" alt="導覽圖片" class="nav-image"></a>
    </div>
    <nav class="nav">
      <!-- 可複製原本主選單 -->
    </nav>
  </div>
</header>

<main>
  <div class="top-nature">
  <h2>人文景觀前三名</h2>
  <div class="blocks-container">
    <!-- Block 1 -->
    <div class="nature-block">
      <div class="rank">1</div>
      <img src="IMG_3810 2.jpg" alt="中正紀念堂">
      <h3>中正紀念堂</h3>
      <p>莊重威嚴，矗立於偌大的自由廣場上，在陽光的照耀下，更添一分令人敬畏的感覺。</p>
    </div>

    <!-- Block 2 -->
    <div class="nature-block">
      <div class="rank">2</div>
      <img src="IMG_3687.jpg" alt="四四南村">
      <h3>四四南村</h3>
      <p>眷村的懷舊風格，和台北101充滿現代感的建築，出現在同一個圖層，呈現出一種衝突和不協調的美。</p>
    </div>

    <!-- Block 3 -->
    <div class="nature-block">
      <div class="rank">3</div>
      <img src="IMG_4463.jpg" alt="九份老街">
      <h3>九份老街</h3>
      <p>彷彿走入神影少女的電影場景中，白天與夜晚給人截然不同的感受。</p>
    </div>
  </div>
</div>



</main>
</body>
</html>
